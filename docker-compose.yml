version: '3.8'

services:
  receipt-processor:
    build: .
    container_name: receipt-processor
    restart: unless-stopped
    environment:
      - TZ=Asia/Tokyo
      # コンテナ内のパス
      - WATCH_DIR=/data/inbox
      - DEST_BASE_DIR=/data/db
      - MANUAL_DIR=/data/db/Manual_Check
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    volumes:
      # NASの実パス : コンテナ内のパス
      - "/volume1/homes/sntmse/SLA SntMse生涯文庫™︎/SLAレシートアーカイブ/処理前:/data/inbox"
      - "/volume1/homes/sntmse/SLA SntMse生涯文庫™︎/SLAレシートアーカイブ/KJ 京都期間:/data/db"
      - "./src:/app/src"
      - "./credentials.json:/app/credentials.json:ro"